name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-76654087-ocacr2]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # URL of your deployed FastAPI backend (no trailing slash, no /api).
      # Set it under Settings > Secrets and variables > Actions > Variables.
      REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
      CI: false  # CRA treats lint warnings as errors when CI=true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # default list includes the removed legacy 'tools' package
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check backend URL
        run: |
          if [ -z "$REACT_APP_BACKEND_URL" ]; then
            echo "::warning::REACT_APP_BACKEND_URL repository variable is not set; the app will not be able to reach the backend."
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web app and sync into Android project
        run: yarn cap:sync

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret not set; skipping signed release build."
          fi

      - name: Build signed release APK + AAB
        if: steps.keystore.outputs.path != ''
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tailzyai-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: tailzyai-release
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
